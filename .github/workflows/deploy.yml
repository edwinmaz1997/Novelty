name: Deploy FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compilar CSS (Tailwind)
        run: |
          npm install --no-audit --no-fund
          npm run build:css

      - name: Minificar y ofuscar JavaScript (solo en el servidor; el repo queda legible)
        run: |
          for f in assets/js/*.js; do
            npx --yes terser@5 "$f" --compress passes=2 --mangle toplevel=false --comments false -o "$f"
          done

      - name: Subir por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.estudiocero.com.gt
          username: deploy@novelty.nuevaexpress.com
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            README.md
            package.json
            package-lock.json
            tailwind.config.js
            assets/css/tw-input.css
            uploads/vehiculos/**
            uploads/sitio/**
            app/config.local.php
            .env
